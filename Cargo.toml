[package]
name = "deka-modules"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "deka's module-resolution contracts: specifier vocabulary, project gate, DS import scanning, ds_modules resolution"
repository = "https://github.com/dekaruntime/modules"
publish = ["crates-io"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23.0"
